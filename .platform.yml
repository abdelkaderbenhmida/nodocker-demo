stages:
  - name: unit tests with coverage
    image: python:3.11-slim
    run: pip install --no-cache-dir -q -r requirements.txt pytest pytest-cov && pytest -q --cov=. --cov-report=term-missing
  - name: write build stamp
    image: python:3.11-slim
    run: date -u +%Y-%m-%dT%H:%M:%SZ > BUILD_STAMP && cat BUILD_STAMP
